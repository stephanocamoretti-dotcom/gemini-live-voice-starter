<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="55%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="400" rx="20" fill="url(#bg)"/>
  <circle cx="960" cy="200" r="240" fill="url(#glow)"/>

  <!-- Subtle grid -->
  <g opacity="0.08" stroke="#94A3B8" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
  </g>

  <!-- Waveform bars on the right -->
  <g transform="translate(820, 120)" fill="url(#accent)">
    <rect x="0" y="55" width="12" height="50" rx="6" opacity="0.6"/>
    <rect x="24" y="30" width="12" height="100" rx="6" opacity="0.8"/>
    <rect x="48" y="10" width="12" height="140" rx="6"/>
    <rect x="72" y="40" width="12" height="80" rx="6" opacity="0.9"/>
    <rect x="96" y="0" width="12" height="160" rx="6"/>
    <rect x="120" y="25" width="12" height="110" rx="6" opacity="0.85"/>
    <rect x="144" y="5" width="12" height="150" rx="6"/>
    <rect x="168" y="35" width="12" height="90" rx="6" opacity="0.9"/>
    <rect x="192" y="18" width="12" height="124" rx="6" opacity="0.95"/>
    <rect x="216" y="45" width="12" height="70" rx="6" opacity="0.75"/>
    <rect x="240" y="60" width="12" height="40" rx="6" opacity="0.55"/>
  </g>

  <!-- Tag pill -->
  <rect x="72" y="74" width="250" height="34" rx="17" fill="#0F172A" stroke="#38BDF8" stroke-opacity="0.5"/>
  <text x="197" y="96" text-anchor="middle" fill="#38BDF8" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="1.2">BIDIRECTIONAL VOICE AI</text>

  <!-- Title -->
  <text x="72" y="175" fill="#F8FAFC" font-family="Inter, system-ui, sans-serif" font-size="52" font-weight="800">gemini-live-voice-starter</text>
  <text x="72" y="222" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="21">
    16kHz / 24kHz Raw PCM AudioWorklet · Instant Barge-In · Gemini 3.8 Live
  </text>

  <!-- Feature pills -->
  <g transform="translate(72, 268)" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600">
    <rect x="0" y="0" width="146" height="38" rx="10" fill="#1E293B" stroke="#334155"/>
    <text x="73" y="24" text-anchor="middle" fill="#38BDF8">AudioWorklet</text>

    <rect x="162" y="0" width="150" height="38" rx="10" fill="#1E293B" stroke="#334155"/>
    <text x="237" y="24" text-anchor="middle" fill="#34D399">Instant Barge-In</text>

    <rect x="328" y="0" width="176" height="38" rx="10" fill="#1E293B" stroke="#334155"/>
    <text x="416" y="24" text-anchor="middle" fill="#818CF8">@google/genai SDK</text>

    <rect x="520" y="0" width="150" height="38" rx="10" fill="#1E293B" stroke="#334155"/>
    <text x="595" y="24" text-anchor="middle" fill="#F8FAFC">100dvh Mobile UI</text>
  </g>
